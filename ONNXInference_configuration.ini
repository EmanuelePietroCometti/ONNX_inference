[Logger]
# Imposta la verbosità del logger. Valori validi 0/1/2: 0 = Info, Warning, Error, 1 = Warning, Error e 2 = Error
verbosity=0
# Questo valore permette a fmt (libreria usata per il log) di attivare o disattivare la stampa a colori se ansi non supportato
ansiColorSupported=false	
# Numero massimo di caratteri di un messaggio di una singola stampa del logger
maxMessagesChars=480
# Il logger non stampa immediatamente ma a intervalli regolari. I vari messaggi vengono conservati
# in una coda. Questo parametro permette di controllare il numero di valori della coda.
queueCapacity=4096
# Intervallo ogni quanto viene liberata la coda stampando a schermo
flushIntervalMs=200

notifyThreshold=120
# Questa sezione viene utilizzato solo se il progetto viene compilato in Debug/Release
[TensorRT]
# Abilita e disabilità l'ottimizzazione del modello a fp16. Permette di aumentare le prestazioni (velocità di inferenza) ma riduce la 
# precisione del modello. La perdita stimata è nell'ordine di un punto percentuale rispetto al modello fp32 con velocità di inferenza circa 
# raddoppiata. Valido solo per l'esecuzione in gpu.
fp16=1
# Abilita l'uso della cache. Velocizza il caricamento dei modelli rimuovendo la costruzione dell'engine.
# Se disattivata il ricaricamento del modello richiede diversi minuti per la costruzione di un nuovo modello ottimizzato per la GPU target.
cacheEnable=1
# Path della cache che contiene gli engine compilati 
engineCache="D:\DV\dl"
# Path della cache che contiene il file che permette di ricreare engine ricompilando solo i nodi della rete effettivamente cambiati
timingCache="D:\DV\dl"
# Livello di ottimizzazione usato dal modello. Valori validi: 0-5. 0 = ottimizzazione minima del modello, 5 = ottimizzazione massima
# Un livello di ottimizzazione più alto richiede più tempo e più memoria GPU per la costruzione del modello finale ma porta a modelli più 
# ottimizzati, quindi più veloci
optimizationLevel=5
# Numero di iterazioni di warm up del motore di inferenza per preparare il sistema all'inferenza
# Importantissimo durante l'esecuzione in GPU per evitare tempi molto alti all'inizio dell'esecuzione
warmUpRuns=200
# Questa sezione viene utilizzata solo se il progetto viene compilato in Debug-OpenVINO/Release-OpenVINO
# Memoria massima (in MB) che TensorRT può usare come workspace per la costruzione dell'engine.
# 0 = nessun limite imposto, TensorRT usa la memoria GPU disponibile
maxWorkspaceSizeMB=0
# Numero massimo di iterazioni con cui ORT prova a partizionare il grafo tra TensorRT e gli altri provider
maxPartitionIterations=1000
# Dimensione minima (numero di nodi) di un sottografo perché venga affidato a TensorRT. Sottografi più piccoli vanno a CUDA/CPU
minSubgraphSize=1
# Abilita la quantizzazione INT8 (richiede tabella di calibrazione). 0 = disabilitato, 1 = abilitato
int8Enable=0
# Usa la tabella di calibrazione nativa di TensorRT invece di quella di ORT. Valido solo con int8Enable=1
int8UseNativeCalibrationTable=0
# Salva su disco i sottografi assegnati a TensorRT (solo per debug). 0 = disabilitato, 1 = abilitato
dumpSubgraphs=0
[CUDA]
# Abilita l'utilizzo del workspace massimo disponiile per l'ottimizzazione cuDNN
cudaConvUseMaxWorkspace=1
# Memoria GPU massima (in MB) che l'arena CUDA di ONNX Runtime puo' allocare. 0 = nessun limite
gpuMemLimitMB=2048
# Strategia con cui l'arena CUDA aumenta la memoria quando finisce.
# kNextPowerOfTwo = raddoppia (meno allocazioni, piu' memoria), kSameAsRequested = alloca solo quanto richiesto
arenaExtendStrategy=kSameAsRequested
# Come cuDNN sceglie l'algoritmo per le convoluzioni.
# EXHAUSTIVE = prova tutti gli algoritmi (primo avvio lento, poi il piu' veloce), HEURISTIC = scelta euristica, DEFAULT = algoritmo di default
cudnnConvAlgoSearch=HEURISTIC
# 1 = le copie host/device usano lo stream di default, 0 = stream dedicato
doCopyInDefaultStream=1
# 1 = le convoluzioni 1D vengono convertite in NC1D (richiesto da alcune versioni di cuDNN), 0 = disabilitato
cudnnConv1dPadToNc1d=1
[ONNX]
# Numero di iterazioni di warm up da eseguire per fornire la GPU già calda e pronta all'inferenza
warmUps=200
[GeneralConfiguration]
#  Numero massimo di punti di controllo
maxControlPoints=1000
# Numero massimo di caratteri dell'errore stampato sul json dal managerONNX
maxText=400
# Indice del dispositivo su cui fare inferenza 0 indica la gpu 0
device=0
# Politica con cui ONNX Runtime sceglie da solo l'execution provider. Usata solo quando viene richiesto CUDA.
# Vuoto = scelta esplicita della GPU tramite 'device' (comportamento attuale).
# Valori validi: PREFER_GPU, PREFER_CPU, PREFER_NPU, MAX_PERFORMANCE, MAX_EFFICIENCY, MIN_OVERALL_POWER
epSelectionPolicy=MAX_PERFORMANCE